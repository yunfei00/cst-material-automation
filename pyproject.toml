[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "cst-material-automation"
version = "0.1.0"
description = "Offline CST material assignment automation framework"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy>=1.26,<3", "pydantic>=2,<3"]

[project.optional-dependencies]
desktop = ["PySide6>=6.7,<7"]
geometry = ["scipy>=1.13,<2"]
storage = ["sqlalchemy>=2,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.8", "mypy>=1.13"]

[tool.hatch.build.targets.wheel]
packages = ["src/cst_material"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cst_real: requires locally installed CST Studio Suite"]

[tool.ruff]
target-version = "py311"
line-length = 100
